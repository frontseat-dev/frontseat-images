# Wolfi's fixes, every night. Each image's packages are resolved against
# Wolfi as it is now, per architecture, into images/<name>/packages.txt.
# When anything moved, a pull request "fix(images): Wolfi package updates"
# shows exactly what; merging it makes release-please's next release a
# patch, and that release publishes images with the new packages.
name: refresh
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  refresh:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
      - name: resolve every image's packages
        run: |
          for dir in images/*/; do
            {
              echo "# What ${dir}apko.yaml resolves to: arch, package, version. Written by refresh.yml."
              for arch in x86_64 aarch64; do
                apko show-packages "${dir}apko.yaml" --arch "$arch" \
                  --repository-append "$PWD/apks" --keyring-append "$PWD/melange.rsa.pub" \
                  | sort | sed "s/^/$arch /"
              done
            } > "${dir}packages.txt"
          done
          rm -rf apks melange.rsa.pub
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: refresh/wolfi
          commit-message: 'fix(images): Wolfi package updates'
          title: 'fix(images): Wolfi package updates'
          body: |
            Wolfi's packages moved since the last refresh; the diff of each
            `images/*/packages.txt` is what changes. Merging this makes the
            next release a patch, which publishes the images with them.
          labels: wolfi
          delete-branch: true
