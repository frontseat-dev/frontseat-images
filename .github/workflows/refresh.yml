# Wolfi's fixes, every night. Each image's packages are resolved against
# Wolfi as it is now, per architecture, into images/<name>/packages.txt.
# When anything moved, that is committed to main as "fix(images): Wolfi
# package updates", listing what moved, and released as a patch. (A
# workflow's own push starts no workflow, so this releases it itself.)
name: refresh
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  refresh:
    needs: packages
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
      - name: resolve every image's packages
        run: |
          for dir in images/*/; do
            {
              echo "# What ${dir}apko.yaml resolves to: arch, package, version. Written by refresh.yml."
              for arch in x86_64 aarch64; do
                apko show-packages "${dir}apko.yaml" --arch "$arch" \
                  --repository-append "$PWD/apks" --keyring-append "$PWD/melange.rsa.pub" \
                  | sort | sed "s/^/$arch /"
              done
            } > "${dir}packages.txt"
          done
          rm -rf apks melange.rsa.pub
      - id: commit
        name: commit what moved
        run: |
          if git diff --quiet -- images; then
            echo "Wolfi has not moved"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff -U0 -- images | grep -E '^[+-][a-z]' > moved.txt || true
          git commit -q -F - -- images <<EOF
          fix(images): Wolfi package updates

          $(cat moved.txt)
          EOF
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: refresh
    if: needs.refresh.outputs.commit != ''
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.refresh.outputs.commit }}
