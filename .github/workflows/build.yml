# Builds the packages Wolfi lacks (packages/, melange) and every image
# (images/, apko) for amd64 and arm64, and publishes the images to
# ghcr.io/frontseat-dev, signed (cosign, keyless). Every night, so Wolfi's
# fixes land, and on every change. The packages are only consumed here: they
# are signed with a key made for the run and never published.
name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
env:
  REGISTRY: ghcr.io/frontseat-dev
  # Chainguard's melange image is published as latest only: pinned by digest.
  MELANGE: cgr.dev/chainguard/melange@sha256:e2254659aab8bcecb4f7c612ef27524a49523378409af89c0cae23b455ad0061
  APKO_VERSION: 1.4.8
  APKO_SHA256: 3a90aa8b86df51e25db9e29a8b87b468ed716eef0de251fc9d8b1e6d0bf71c8e
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # melange builds each architecture's package in that architecture.
      - uses: docker/setup-qemu-action@v3
      - name: apko
        run: |
          curl -fsSLo apko.tgz "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz"
          echo "${APKO_SHA256}  apko.tgz" | sha256sum -c -
          tar -xzf apko.tgz --strip-components=1 -C /usr/local/bin "apko_${APKO_VERSION}_linux_amd64/apko"
          rm apko.tgz
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.3
      - name: packages
        run: |
          docker run --rm -v "$PWD":/work -w /work "$MELANGE" keygen
          for recipe in packages/*.yaml; do
            docker run --rm --privileged -v "$PWD":/work -w /work "$MELANGE" \
              build "$recipe" --arch x86_64,aarch64 --signing-key melange.rsa --out-dir packages
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: images
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # image directory -> published name
          for pair in base:base git:base-git runner:buildbarn-runner; do
            dir="${pair%%:*}" name="${pair##*:}"
            # --sbom=false: apko 1.4.8 fails its own SBOM check on Wolfi's
            # libLLVM (a PURL case mismatch); back on once that is fixed.
            apko publish "images/$dir/apko.yaml" "$REGISTRY/$name:$tag" \
              --arch x86_64,aarch64 --sbom=false \
              --repository-append "$PWD/packages" --keyring-append "$PWD/melange.rsa.pub" \
              --image-refs "refs-$name.txt"
            ref="$(head -n1 "refs-$name.txt")"
            cosign sign --yes "$ref"
            echo "| $name | \`$REGISTRY/$name:$tag\` | \`${ref#*@}\` |" >> published.md
          done
          { echo "| image | tag | digest |"; echo "|---|---|---|"; cat published.md; } >> "$GITHUB_STEP_SUMMARY"
