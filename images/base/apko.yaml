# The base every Frontseat service runs on: Wolfi's base layout, the CA
# bundle, timezones, git (the asset service fetches repositories with it;
# the rest ignore it) and a non-root user. Statically linked Go programs
# are laid on top of it (gib, in frontseat-enterprise).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
  - aarch64
